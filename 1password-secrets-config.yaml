# 1Password Secrets Management Configuration
# This file defines how secrets are managed across repositories

version: "1.0"
description: "Centralized secret management for MCP servers"

# Secret vaults configuration
vaults:
  development:
    name: "Development Secrets"
    description: "Development environment secrets (lower security)"
    access_level: "read-write"

  staging:
    name: "Staging Secrets"
    description: "Staging environment secrets (medium security)"
    access_level: "read-only"

  production:
    name: "Production Secrets"
    description: "Production environment secrets (highest security)"
    access_level: "read-only"
    require_approval: true

# Secrets by category
secrets:
  api_keys:
    - name: "github-token"
      vault: "development"
      item: "github-credentials"
      field: "token"
      rotation_interval: 90
      description: "GitHub API token for repository access"

    - name: "npm-token"
      vault: "development"
      item: "npm-credentials"
      field: "token"
      rotation_interval: 180
      description: "NPM registry authentication token"

    - name: "claude-api-key"
      vault: "development"
      item: "claude-credentials"
      field: "api_key"
      rotation_interval: 60
      description: "Claude API key for AI services"

  database:
    - name: "database-url"
      vault: "development"
      item: "database-connection"
      field: "connection_string"
      rotation_interval: 120
      description: "Database connection string"

    - name: "database-user"
      vault: "development"
      item: "database-connection"
      field: "username"
      rotation_interval: 120
      description: "Database username"

    - name: "database-password"
      vault: "development"
      item: "database-connection"
      field: "password"
      rotation_interval: 120
      description: "Database password"

  ssh_keys:
    - name: "ssh-private-key"
      vault: "development"
      item: "ssh-credentials"
      field: "private_key"
      rotation_interval: 365
      description: "SSH private key for server access"

    - name: "ssh-known-hosts"
      vault: "development"
      item: "ssh-credentials"
      field: "known_hosts"
      rotation_interval: 0
      description: "SSH known_hosts file"

  oauth:
    - name: "oauth-client-id"
      vault: "development"
      item: "oauth-credentials"
      field: "client_id"
      rotation_interval: 180
      description: "OAuth client ID"

    - name: "oauth-client-secret"
      vault: "development"
      item: "oauth-credentials"
      field: "client_secret"
      rotation_interval: 90
      description: "OAuth client secret"

# Environment variable mappings
environment_variables:
  development:
    GITHUB_TOKEN: "api_keys.github-token"
    NPM_TOKEN: "api_keys.npm-token"
    CLAUDE_API_KEY: "api_keys.claude-api-key"
    DATABASE_URL: "database.database-url"
    DATABASE_USER: "database.database-user"
    DATABASE_PASSWORD: "database.database-password"
    SSH_PRIVATE_KEY: "ssh_keys.ssh-private-key"
    SSH_KNOWN_HOSTS: "ssh_keys.ssh-known-hosts"
    OAUTH_CLIENT_ID: "oauth.oauth-client-id"
    OAUTH_CLIENT_SECRET: "oauth.oauth-client-secret"

  staging:
    GITHUB_TOKEN: "api_keys.github-token"
    NPM_TOKEN: "api_keys.npm-token"
    CLAUDE_API_KEY: "api_keys.claude-api-key"
    DATABASE_URL: "database.database-url"
    DATABASE_USER: "database.database-user"
    DATABASE_PASSWORD: "database.database-password"

  production:
    GITHUB_TOKEN: "api_keys.github-token"
    NPM_TOKEN: "api_keys.npm-token"
    CLAUDE_API_KEY: "api_keys.claude-api-key"
    DATABASE_URL: "database.database-url"
    DATABASE_USER: "database.database-user"
    DATABASE_PASSWORD: "database.database-password"

# Validation rules
validation:
  required_fields:
    - GITHUB_TOKEN
    - NPM_TOKEN
    - CLAUDE_API_KEY

  secret_formats:
    github-token:
      pattern: "^ghp_[A-Za-z0-9_]{36,255}$"
      description: "GitHub token pattern"

    npm-token:
      pattern: "^npm_[A-Za-z0-9_]{36,255}$"
      description: "NPM token pattern"

    api-key:
      pattern: "^[A-Za-z0-9_-]{20,}$"
      description: "API key pattern"

# Audit and monitoring
audit:
  log_access: true
  log_file: "~/.1password/audit.log"
  track_rotations: true
  notify_on_access: true

monitoring:
  check_expiry: true
  expiry_warning_days: 14
  alert_on_rotation: true
