name: Deploy with 1Password Secrets

on:
  workflow_dispatch:
    inputs:
      server:
        description: 'MCP Server to deploy (all, api-mcp-server, claude-memory-mcp, github-mcp-server, mcp-ssh-server)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - api-mcp-server
          - claude-memory-mcp
          - github-mcp-server
          - mcp-ssh-server
      environment:
        description: 'Deployment environment (development, staging, production)'
        required: false
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        id: op-login
        uses: 1Password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GH_TOKEN: op://${{ github.event.inputs.environment == 'production' && 'Production Secrets' || github.event.inputs.environment == 'staging' && 'Staging Secrets' || 'Development Secrets' }}/github-credentials/token
          NPM_TOKEN: op://${{ github.event.inputs.environment == 'production' && 'Production Secrets' || github.event.inputs.environment == 'staging' && 'Staging Secrets' || 'Development Secrets' }}/npm-credentials/token
          CLAUDE_API_KEY: op://${{ github.event.inputs.environment == 'production' && 'Production Secrets' || github.event.inputs.environment == 'staging' && 'Staging Secrets' || 'Development Secrets' }}/claude-credentials/api_key
          SSH_PRIVATE_KEY: op://${{ github.event.inputs.environment == 'production' && 'Production Secrets' || github.event.inputs.environment == 'staging' && 'Staging Secrets' || 'Development Secrets' }}/ssh-credentials/private_key

      - name: Setup 1Password CLI
        uses: 1Password/install-cli-action@v1

      - name: Verify 1Password Authentication
        run: |
          op account get
          echo "✓ Authenticated with 1Password"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: List Available Vaults
        run: |
          echo "Available vaults:"
          op vault list --format json | jq -r '.[] | "  - \(.name) (\(.id))"'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        continue-on-error: true

      - name: Display Deployment Info
        run: |
          echo "Deployment Configuration:"
          echo "  Server: ${{ github.event.inputs.server }}"
          echo "  Environment: ${{ github.event.inputs.environment }}"
          echo "  Repository: ${{ github.repository }}"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Run ID: ${{ github.run_id }}"

      - name: Create Deployment Record
        run: |
          cat > deployment-info.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "server": "${{ github.event.inputs.server }}",
            "environment": "${{ github.event.inputs.environment }}",
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
            "run_id": "${{ github.run_id }}"
          }
          EOF
          cat deployment-info.json

      - name: Deploy MCP Servers
        run: |
          echo "Deploying ${{ github.event.inputs.server }} to ${{ github.event.inputs.environment }}..."
          echo "This is a deployment template that would execute your deployment scripts."
          echo ""
          echo "To implement actual deployment, add your deployment commands here."
          echo "Example: ./.github/profile/deploy.sh deploy ${{ github.event.inputs.server }}"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DEPLOYMENT_ENV: ${{ github.event.inputs.environment }}

      - name: Post Deployment Verification
        if: success()
        run: |
          echo "✓ Deployment completed successfully"
          echo "Deployment logs available in GitHub Actions UI"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "✗ Deployment failed"
          echo "Check the workflow logs for details"
